# TrueNAS with Docker Apps (24.10 or later).
# Replace /mnt/CHANGE_ME/... with existing datasets before installing.
# 192.168.1.10 is an example: replace it with your NAS address.
# Portal metadata is read on fresh app creation by TrueNAS 24.10.2.3.
# Existing YAML apps may need the URL opened manually; see docs/TRUENAS_RU.md.
x-portals:
  - name: Web UI
    scheme: http
    host: "0.0.0.0"
    port: 31800
    path: /
services:
  mailru-photos:
    image: ghcr.io/zhalenik/mail_cloud:stable
    # Fetch the current tag on install, Edit/Save, and TrueNAS app Start.
    pull_policy: always
    # Pin a release when needed: ghcr.io/zhalenik/mail_cloud:v0.9.0
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    ports:
      - "31800:8787"
    environment:
      MAILRU_ALLOWED_HOSTS: "192.168.1.10"
      MAILRU_TIMEZONE: "Europe/Moscow"
    volumes:
      - type: bind
        source: /mnt/CHANGE_ME/appdata/mail_cloud
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/CHANGE_ME/photos
        target: /photos
        # Set false only to enable explicitly confirmed deletion of originals.
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
