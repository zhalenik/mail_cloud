# TrueNAS with Docker Apps (24.10 or later).
# Replace /mnt/CHANGE_ME/... with existing datasets before installing.
# Change the LAN IP below if your NAS uses another address.
# The GHCR image must have been published before TrueNAS can pull it.
services:
  mailru-photos:
    image: ghcr.io/zhalenik/mail_cloud:stable
    # Pin a release when needed: ghcr.io/zhalenik/mail_cloud:v0.4.1
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    ports:
      - "31800:8787"
    environment:
      MAILRU_ALLOWED_HOSTS: "192.168.68.106"
    volumes:
      - type: bind
        source: /mnt/CHANGE_ME/appdata/mail_cloud
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/CHANGE_ME/photos
        target: /photos
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
